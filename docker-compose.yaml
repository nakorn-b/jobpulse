services:
  postgres:
    image: postgres:18
    ports:
      - "5433:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=password
    restart: always
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  prefect-server:
    image: prefecthq/prefect:3.7.2-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect   # SQLite database lives here
    restart: always

  api:
    build: .
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside Docker, reach other services by name (overrides localhost values in .env)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      QDRANT_LOCAL_HOST_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always

volumes:
  postgres-db-volume:
  qdrant_storage:
  prefect-data: